version: 2

sources:
  - name: part2
    description: >
      Part 2's metrics layer (`../football-data-analytics/data/analytics.duckdb`),
      ATTACHed READ_ONLY by profiles.yml. Its marts and int_ models already handle
      the Gold traps and are tested there (131 dbt tests); reading them means
      inheriting those fixes rather than rediscovering them (CLAUDE.md §3).

      Every column read from here is listed in `contracts/part2_columns.json`, and
      the build refuses a database that has drifted from it or gone stale against
      its snapshot — see the on-run-start hooks in dbt_project.yml.

      **Which tables may be read is itself a rule (CLAUDE.md §5, L1–L2).**
      `mart_team_form` includes the match itself in its window, and the season-level
      marts summarise matches not yet played at mid-season. Neither is declared here
      as a plain source; a season mart may only arrive as `src_*_prior`.
    database: part2
    schema: main
    tables:
      - name: int_team_matches
        description: One row per team per counting match — two rows per fixture.
      - name: stg_matches
        description: 1:1 with Gold's fact_matches. Read only for its row count, by the staleness hook.
      - name: mart_team_season
        description: >
          One row per team × season × competition — a summary of the **whole** season.
          Read only through src_team_season_prior, as the previous season's summary
          (CLAUDE.md §5, L2); never joined on the current season.
      - name: mart_shots
        description: >
          One row per shot, deduplicated by Part 2 (its trap 14), with season and
          competition attached. Includes penalties and own goals; feat_shots removes
          them. `xg` is Understat's model — the benchmark for model #3, never a feature
          of it (CLAUDE.md §5, L9).
      - name: stg_teams
        description: >
          One row per club, with Part 2's conformed display name. Read only to label the
          predictions export (CLAUDE.md §9); never a feature.

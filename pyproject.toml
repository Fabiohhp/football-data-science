[project]
name = "football-ml"
version = "0.1.0"
description = "Part 3 — Machine Learning: match outcome and xG models over the marts built by football-data-analytics"
requires-python = ">=3.12"

# Only what the current phase uses. The modelling stack in CLAUDE.md §3
# (scikit-learn, statsmodels, scipy, matplotlib, mplsoccer, joblib, Jupyter) is
# added by the phase that first needs it, so every dependency arrives with a reason.
dependencies = [
    # Same pins as Part 2's lock, so both repositories open analytics.duckdb with
    # the same DuckDB storage version.
    "duckdb>=1.5,<1.6",
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
    # Phase 1: splits and the feature loader.
    "numpy>=2.0",
    "pandas>=2.2",
    # Phase 2: baselines, model #1, evaluation (CLAUDE.md §3). HistGradientBoosting
    # is in scikit-learn, so no XGBoost/LightGBM; statsmodels carries the ordered
    # logit that turns an Elo difference into H/D/A probabilities.
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "scipy>=1.14",
    "joblib>=1.4",
    # Phase 6: the notebooks and the README's charts (CLAUDE.md §3) — static images,
    # because GitHub's notebook view is where a reviewer reads them.
    "matplotlib>=3.9",
    "mplsoccer>=1.4",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.8",
    "pytest>=8.3",
    # CI re-executes every notebook, as Part 2's does.
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_ml"]

# Line length and rule selection match Parts 1 and 2.
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
  pull_request:
  # A weekly run, so the part2-integration job notices a Part 2 change even in a week
  # with no commits here.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # Self-contained: needs nothing outside this repository. CI generates a stand-in Part 2
  # from contracts/part2_columns.json with tests/synthetic_part2.py — the same generator
  # the tests use — and builds the features, and every leakage test, on top of it. Then it
  # does the same on part2_snapshot/, the real data a fresh clone builds on.
  build:
    runs-on: ubuntu-latest
    env:
      PART2_DIR: ${{ github.workspace }}/.synthetic-part2
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      # Includes the tests that break things on purpose: a stale or drifted Part 2
      # (test_part2_guards.py) and planted L1/L2 leaks (test_leakage.py).
      - name: Run tests
        run: uv run pytest -q

      - name: Generate a synthetic Part 2
        run: uv run python tests/synthetic_part2.py "$PART2_DIR"

      # The on-run-start hooks check the synthetic Part 2 against the contract and its
      # manifest; then the features and their leakage tests run.
      - name: dbt build (on the synthetic Part 2)
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: dbt build (on the committed Part 2 snapshot)
        env:
          PART2_DIR: part2_snapshot
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

  # The real thing: Part 2 checked out beside this repository and built on its own
  # fixture, which carries the Gold-level traps the synthetic Part 2 does not. It is
  # how a Part 2 change that breaks this repository shows up here.
  part2-integration:
    runs-on: ubuntu-latest
    env:
      GOLD_SNAPSHOT_DIR: tests/fixtures/gold # relative to Part 2's root, in both repos
      PART2_DIR: ../football-data-analytics
    defaults:
      run:
        working-directory: football-data-science
    steps:
      # Both repositories side by side, with PART2_DIR aimed at the sibling.
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: football-data-science

      # Part 2's default branch, deliberately not pinned: the point is to find out
      # when Part 2 changes under this repository.
      - name: Check out Part 2 beside it
        uses: actions/checkout@v4
        with:
          repository: Fabiohhp/football-data-analytics
          path: football-data-analytics

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Build Part 2's marts on its fixture
        working-directory: football-data-analytics
        run: |
          uv sync
          uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: dbt build (on Part 2's fixture)
        run: |
          uv sync
          uv run dbt build --project-dir dbt --profiles-dir dbt

  # The notebooks read only the committed reports/*.json, so they run with no data and
  # no database. Re-executing them proves they still run against the reports; the second
  # step proves the README's charts are byte for byte the committed notebooks' figures.
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Execute every notebook
        run: |
          uv run python - <<'PY'
          import sys
          from pathlib import Path

          import nbformat
          from nbclient import NotebookClient

          failed = []
          for path in sorted(Path("notebooks").glob("*.ipynb")):
              print(f"--- executing {path}", flush=True)
              nb = nbformat.read(path, as_version=4)
              try:
                  NotebookClient(
                      nb, timeout=600, kernel_name="python3",
                      resources={"metadata": {"path": str(path.parent)}},
                  ).execute()
              except Exception as exc:  # noqa: BLE001 - report all, fail once
                  print(f"::error file={path}::{type(exc).__name__}: {exc}")
                  failed.append(path)
          if failed:
              sys.exit(1)
          PY

      - name: README charts match the committed notebooks
        run: |
          uv run python scripts/export_readme_images.py
          if ! git diff --quiet -- docs/images; then
            echo "::error::docs/images differs from the notebooks' committed figures."
            echo "Re-run: uv run python scripts/export_readme_images.py"
            exit 1
          fi
